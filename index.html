<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختر فريقك</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Arial, sans-serif; }
:root { --gold:#fbbf24; }
body {
  min-height:100vh; background:#0a0a1a; color:#fff; overflow-x:hidden;
  background-image: radial-gradient(circle at 20% 20%, rgba(139,92,246,.25), transparent 40%),
                   radial-gradient(circle at 80% 80%, rgba(6,182,212,.2), transparent 40%);
}
/* animated particles */
.particles { position:fixed; inset:0; z-index:0; pointer-events:none; }
.particles span { position:absolute; bottom:-20px; border-radius:50%; background:rgba(168,85,247,.5); animation:rise linear infinite; }
@keyframes rise { to { transform:translateY(-110vh); opacity:0; } }
.screen { display:none; min-height:100vh; padding:20px; position:relative; z-index:1; }
.screen.active { display:flex; flex-direction:column; align-items:center; justify-content:center; animation:fadeIn .5s ease; }
@keyframes fadeIn { from{opacity:0; transform:translateY(15px);} to{opacity:1; transform:none;} }

.card {
  background:rgba(255,255,255,.06); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.12);
  border-radius:22px; padding:34px 28px; width:100%; max-width:420px;
  box-shadow:0 0 40px rgba(139,92,246,.25), inset 0 0 30px rgba(255,255,255,.03);
}
h1 { text-align:center; margin-bottom:8px; background:linear-gradient(90deg,#a78bfa,#22d3ee,#fbbf24);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; font-size:1.9rem; }
.sub { text-align:center; color:#94a3b8; margin-bottom:22px; font-size:.95rem; }

.tabs { display:flex; background:rgba(0,0,0,.3); border-radius:12px; padding:5px; margin-bottom:22px; }
.tabs button { flex:1; border:0; padding:11px; border-radius:9px; background:transparent; color:#94a3b8; font-size:1rem; cursor:pointer; transition:.3s; font-weight:600; }
.tabs button.on { background:linear-gradient(135deg,#7c3aed,#2563eb); color:#fff; box-shadow:0 0 18px rgba(124,58,237,.5); }

.field { margin-bottom:16px; }
.field label { display:block; margin-bottom:6px; color:#cbd5e1; font-size:.9rem; }
input[type=text], input[type=password], input[type=number] {
  width:100%; padding:13px 15px; border-radius:12px; border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.35); color:#fff; font-size:1rem; outline:none; transition:.3s;
}
input:focus { border-color:#a78bfa; box-shadow:0 0 14px rgba(167,139,250,.4); }
.avatar-row { display:flex; align-items:center; gap:14px; }
.avatar-preview { width:62px; height:62px; border-radius:50%; border:2px dashed rgba(255,255,255,.3);
  display:flex; align-items:center; justify-content:center; font-size:1.6rem; overflow:hidden; flex-shrink:0; background:rgba(0,0,0,.3); }
.avatar-preview img { width:100%; height:100%; object-fit:cover; }
.file-btn { flex:1; }

.btn {
  width:100%; padding:14px; border:0; border-radius:12px; font-size:1.05rem; font-weight:700; cursor:pointer;
  background:linear-gradient(135deg,#7c3aed,#2563eb); color:#fff; transition:.25s; margin-top:6px;
}
.btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(124,58,237,.55); }
.btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.btn.gold { background:linear-gradient(135deg,#f59e0b,#d97706); }
.btn.red { background:linear-gradient(135deg,#dc2626,#991b1b); }
.btn.small { width:auto; padding:8px 16px; font-size:.85rem; margin:0; }

.msg { margin-top:14px; padding:11px; border-radius:10px; text-align:center; font-size:.9rem; display:none; }
.msg.err { display:block; background:rgba(239,68,68,.15); color:#fca5a5; border:1px solid rgba(239,68,68,.35); }
.msg.ok { display:block; background:rgba(34,197,94,.15); color:#86efac; border:1px solid rgba(34,197,94,.35); }

/* admin corner button */
#adminBtn {
  position:fixed; top:16px; left:16px; z-index:10;
  padding:9px 20px; border-radius:999px; border:1px solid rgba(251,191,36,.5);
  background:rgba(0,0,0,.5); color:var(--gold); font-weight:700; cursor:pointer; backdrop-filter:blur(8px);
  transition:.3s; font-size:.9rem;
}
#adminBtn:hover { box-shadow:0 0 18px rgba(251,191,36,.5); background:rgba(251,191,36,.12); }

/* teams */
.teams-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:22px; max-width:1050px; width:100%; margin-top:24px; }
.team-card {
  background:rgba(255,255,255,.05); border-radius:20px; padding:26px 20px; text-align:center; cursor:pointer;
  border:2px solid rgba(255,255,255,.12); transition:.3s; position:relative; overflow:hidden;
}
.team-card:not(.full):hover { transform:translateY(-6px) scale(1.02); box-shadow:0 0 30px var(--glow); border-color:var(--c); }
.team-card.full { opacity:.45; cursor:not-allowed; filter:grayscale(.7); }
.team-card.full::after { content:'مكتمل ✔'; position:absolute; top:12px; inset-inline-start:12px; background:#111; border:1px solid #555; padding:3px 12px; border-radius:999px; font-size:.75rem; color:#aaa; }
.team-card.chosen { border-color:var(--c); box-shadow:0 0 35px var(--glow); }
.team-icon { width:74px; height:74px; margin:0 auto 14px; border-radius:50%; background:var(--c); display:flex; align-items:center; justify-content:center; font-size:2rem; box-shadow:0 0 25px var(--glow); }
.team-name { font-size:1.2rem; font-weight:800; margin-bottom:8px; }
.count { font-size:1.5rem; font-weight:900; color:var(--c); text-shadow:0 0 12px var(--glow); }
.members { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:14px; min-height:38px; }
.member { display:flex; align-items:center; gap:5px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.15); padding:3px 10px 3px 4px; border-radius:999px; font-size:.78rem; }
.member img, .member .no-img { width:24px; height:24px; border-radius:50%; object-fit:cover; background:#333; display:flex; align-items:center; justify-content:center; font-size:.7rem; }

/* scoreboard */
.score-list { width:100%; max-width:560px; display:flex; flex-direction:column; gap:14px; margin-top:20px; }
.score-row {
  display:flex; align-items:center; gap:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
  border-radius:16px; padding:16px 18px; animation:fadeIn .4s;
}
.score-row .bar-wrap { flex:1; }
.score-row .bar { height:10px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; margin-top:6px; }
.score-row .bar i { display:block; height:100%; background:var(--c); border-radius:99px; transition:width .8s ease; box-shadow:0 0 10px var(--glow); }
.score-num { font-size:1.6rem; font-weight:900; color:var(--c); min-width:46px; text-align:center; text-shadow:0 0 12px var(--glow); }
.rank { font-size:1.1rem; width:34px; text-align:center; }

/* modal */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); z-index:50; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-bg.show { display:flex; }
.modal { background:#141428; border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:28px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:0 0 50px rgba(124,58,237,.4); }
.modal h2 { text-align:center; margin-bottom:18px; color:var(--gold); }
.admin-row { display:flex; align-items:center; gap:10px; background:rgba(0,0,0,.3); border-radius:12px; padding:12px; margin-bottom:10px; flex-wrap:wrap; }
.admin-row input[type=number] { width:80px; padding:8px; }
.admin-row .tname { font-weight:700; min-width:90px; }
.admin-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.kick-line { display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,.3); border-radius:10px; padding:9px 12px; margin-bottom:8px; }
.close-x { background:none; border:0; color:#94a3b8; font-size:1.4rem; cursor:pointer; float:left; }
#confetti { position:fixed; inset:0; pointer-events:none; z-index:99; }
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<canvas id="confetti"></canvas>
<button id="adminBtn" onclick="openAdmin()">الادمن</button>

<!-- ============ AUTH ============ -->
<div class="screen active" id="scr-auth">
  <div class="card">
    <h1>⚔️ اختر فريقك</h1>
    <p class="sub">أنشئ حسابك ثم انضم إلى فريقك المفضل قبل اكتمال العدد!</p>
    <div class="tabs">
      <button id="tabLogin" class="on" onclick="switchTab('login')">تسجيل الدخول</button>
      <button id="tabSignup" onclick="switchTab('signup')">إنشاء حساب</button>
    </div>
    <div id="signupFields" style="display:none;">
      <div class="field">
        <label>الصورة الرمزية</label>
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview">👤</div>
          <input type="file" accept="image/*" class="file-btn" id="avatarInput" onchange="previewAvatar(this)">
        </div>
      </div>
    </div>
    <div class="field"><label>اسم المستخدم</label><input type="text" id="username" placeholder="مثال: أحمد"></div>
    <div class="field"><label>كلمة المرور</label><input type="password" id="password" placeholder="••••••"></div>
    <button class="btn" id="authBtn" onclick="doAuth()">دخول</button>
    <div class="msg" id="authMsg"></div>
  </div>
</div>

<!-- ============ TEAMS ============ -->
<div class="screen" id="scr-teams">
  <h1>اختر فريقك</h1>
  <p class="sub" id="welcomeTxt"></p>
  <div class="teams-grid" id="teamsGrid"></div>
</div>

<!-- ============ SCORE ============ -->
<div class="screen" id="scr-score">
  <div class="card" style="max-width:640px;">
    <h1>🏆 لوحة السكور</h1>
    <p class="sub" id="myTeamTxt"></p>
  </div>
  <div class="score-list" id="scoreList"></div>
</div>

<!-- ============ ADMIN MODAL ============ -->
<div class="modal-bg" id="adminModal">
  <div class="modal">
    <button class="close-x" onclick="closeModal('adminModal')">✕</button>
    <div id="adminLoginView">
      <h2>🔐 دخول الأدمن</h2>
      <div class="field"><label>أدخل الرمز السري</label><input type="password" id="adminCode" placeholder="••••••••"></div>
      <button class="btn gold" onclick="adminLogin()">دخول</button>
      <div class="msg" id="adminMsg"></div>
    </div>
    <div id="adminPanelView" style="display:none;">
      <h2>👑 لوحة التحكم</h2>
      <h3 style="color:#cbd5e1; margin-bottom:10px;">الفرق والسكور</h3>
      <div id="adminTeams"></div>
      <div style="border-top:1px solid rgba(255,255,255,.15); margin:16px 0; padding-top:16px;">
        <h3 style="color:#cbd5e1; margin-bottom:10px;">الأعضاء وطرد الأعضاء</h3>
        <div id="adminMembers"></div>
      </div>
      <div style="border-top:1px solid rgba(255,255,255,.15); margin:16px 0; padding-top:16px;">
        <h3 style="color:#cbd5e1; margin-bottom:10px;">إنشاء فريق جديد</h3>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <input type="text" id="newTeamName" placeholder="اسم الفريق" style="flex:2; min-width:120px;">
          <input type="text" id="newTeamColor" placeholder="لون (hex) مثال: #a855f7" style="flex:2; min-width:120px;">
          <input type="number" id="newTeamCap" placeholder="السعة" value="3" style="width:80px;">
          <button class="btn gold small" onclick="addTeam()">إضافة</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let token = localStorage.getItem('token') || null;
let adminToken = null;
let avatarData = null;
let isSignup = false;
let cachedState = null;

// particles
(function(){
  const p = document.getElementById('particles');
  for (let i=0;i<26;i++){
    const s = document.createElement('span');
    const size = 3 + Math.random()*7;
    s.style.width = size+'px'; s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.animationDuration = (6+Math.random()*12)+'s';
    s.style.animationDelay = (-Math.random()*15)+'s';
    p.appendChild(s);
  }
})();

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function switchTab(t){
  isSignup = t==='signup';
  document.getElementById('tabLogin').classList.toggle('on', !isSignup);
  document.getElementById('tabSignup').classList.toggle('on', isSignup);
  document.getElementById('signupFields').style.display = isSignup?'block':'none';
  document.getElementById('authBtn').textContent = isSignup?'إنشاء الحساب والدخول':'دخول';
}
function msg(id, text, ok){ const el=document.getElementById(id); el.className='msg '+(ok?'ok':'err'); el.textContent=text; }

function previewAvatar(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    // compress to max 150px for lightweight storage
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); const scale = Math.min(1, 150/Math.max(img.width,img.height));
      c.width = img.width*scale; c.height = img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      avatarData = c.toDataURL('image/jpeg',0.8);
      document.getElementById('avatarPreview').innerHTML = '<img src="'+avatarData+'">';
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(f);
}

async function api(url, body, needAuth=true){
  const headers = {'Content-Type':'application/json'};
  if (needAuth && token) headers['Authorization'] = 'Bearer '+token;
  if (needAuth && adminToken && url.startsWith('/api/admin')) headers['Authorization'] = 'Bearer '+adminToken;
  const res = await fetch(url, {method:'POST', headers, body: body?JSON.stringify(body):undefined});
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error||'خطأ');
  return data;
}

async function doAuth(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) return msg('authMsg','أدخل اسم المستخدم وكلمة المرور');
  try {
    if (isSignup) {
      await api('/api/signup', {username, password, avatar:avatarData}, false);
      msg('authMsg','تم إنشاء الحساب! جاري الدخول...', true);
    }
    const r = await api('/api/login', {username, password}, false);
    token = r.token; localStorage.setItem('token', token);
    enterApp();
  } catch(e) { msg('authMsg', e.message); }
}

function enterApp(){ document.getElementById('adminBtn').style.display='none'; render(); }

async function render(){
  cachedState = await fetch('/api/state', {headers:{Authorization:'Bearer '+(adminToken||token||'')}}).then(r=>r.json());
  const st = cachedState;
  if (st.admin) { openAdminPanel(); return; }
  if (!st.me) { show('scr-auth'); document.getElementById('adminBtn').style.display='block'; return; }
  if (!st.me.teamId) { renderTeams(st); show('scr-teams'); }
  else { renderScore(st); show('scr-score'); }
}

function avatarHtml(m){
  return m.avatar ? '<img src="'+m.avatar+'">' : '<div class="no-img">'+m.username[0]+'</div>';
}

function renderTeams(st){
  document.getElementById('welcomeTxt').textContent = 'أهلاً '+st.me.username+' 👋 — الأماكن المتبقية تُملأ بسرعة!';
  const g = document.getElementById('teamsGrid'); g.innerHTML='';
  st.teams.forEach(t=>{
    const full = t.members.length >= t.capacity;
    const d = document.createElement('div');
    d.className = 'team-card'+(full?' full':'');
    d.style.setProperty('--c', t.color);
    d.style.setProperty('--glow', t.color+'88');
    let emoji = {'red':'🔴','blue':'🔵','yellow':'🟡','green':'🟢'}[t.id] || '⭐';
    d.innerHTML = '<div class="team-icon">'+emoji+'</div>'+
      '<div class="team-name">'+t.name+'</div>'+
      '<div class="count">'+t.members.length+'/'+t.capacity+'</div>'+
      '<div class="members">'+t.members.map(m=>'<div class="member">'+avatarHtml(m)+'<span>'+m.username+'</span></div>').join('')+'</div>';
    if (!full) d.onclick = ()=>pickTeam(t.id);
    g.appendChild(d);
  });
}

async function pickTeam(id){
  try {
    await api('/api/pick-team', {teamId:id});
    confetti();
    render();
  } catch(e) { alert(e.message); render(); }
}

function renderScore(st){
  const my = st.teams.find(t=>t.id===st.me.teamId);
  document.getElementById('myTeamTxt').innerHTML = my ? 'أنت مع <b style="color:'+my.color+'">'+my.name+'</b> '+st.me.username+' 🎉' : '';
  const list = document.getElementById('scoreList');
  const max = Math.max(1, ...st.teams.map(t=>t.score));
  const sorted = [...st.teams].sort((a,b)=>b.score-a.score);
  list.innerHTML = sorted.map((t,i)=>{
    const membersCount = t.members ? t.members.length : 0;
    return '<div class="score-row" style="--c:'+t.color+'; --glow:'+t.color+'88;">'+
      '<div class="rank">'+['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'][i]||''+'</div>'+
      '<div style="font-weight:800;">'+t.name+'<div style="font-size:.75rem; color:#94a3b8;">'+membersCount+'/'+t.capacity+' أعضاء</div></div>'+
      '<div class="bar-wrap"><div class="bar"><i style="width:'+(t.score/max*100)+'%"></i></div></div>'+
      '<div class="score-num">'+t.score+'</div></div>';
  }).join('');
}

// ---------- admin ----------
function openAdmin(){
  document.getElementById('adminLoginView').style.display = adminToken?'none':'block';
  document.getElementById('adminPanelView').style.display = adminToken?'block':'none';
  document.getElementById('adminModal').classList.add('show');
  if (adminToken) refreshAdmin();
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

async function adminLogin(){
  try {
    const r = await api('/api/admin-login', {code: document.getElementById('adminCode').value}, false);
    adminToken = r.token;
    document.getElementById('adminLoginView').style.display='none';
    document.getElementById('adminPanelView').style.display='block';
    refreshAdmin();
  } catch(e){ msg('adminMsg', e.message); }
}

async function refreshAdmin(){
  const st = await fetch('/api/state', {headers:{Authorization:'Bearer '+adminToken}}).then(r=>r.json());
  cachedState = st;
  const at = document.getElementById('adminTeams'); at.innerHTML='';
  st.teams.forEach(t=>{
    const row = document.createElement('div'); row.className='admin-row';
    row.innerHTML = '<span class="tname" style="color:'+t.color+'">'+t.name+'</span>'+
      '<div class="admin-actions"><span>السكور:</span><input type="number" id="sc_'+t.id+'" value="'+t.score+'">'+
      '<span>السعة:</span><input type="number" id="cp_'+t.id+'" value="'+t.capacity+'">'+
      '<button class="btn small" onclick="saveTeam(\''+t.id+'\')">حفظ</button>'+
      '<button class="btn red small" onclick="delTeam(\''+t.id+'\')">حذف الفريق</button></div>';
    at.appendChild(row);
  });
  const am = document.getElementById('adminMembers'); am.innerHTML='';
  let any=false;
  Object.entries(st.teams).forEach(()=>{});
  // list all members per team
  st.teams.forEach(t=>{
    (t.members||[]).forEach(m=>{
      any=true;
      const l = document.createElement('div'); l.className='kick-line';
      l.innerHTML = '<span>'+m.username+' <small style="color:#94a3b8;">('+t.name+')</small></span><button class="btn red small" onclick="kick(\''+m.username+'\')">طرد</button>';
      am.appendChild(l);
    });
  });
  if (!any) am.innerHTML = '<p style="color:#94a3b8; text-align:center;">لا يوجد أعضاء بعد</p>';
}

async function saveTeam(id){
  try {
    await api('/api/admin/score', {teamId:id, score:document.getElementById('sc_'+id).value});
    await api('/api/admin/capacity', {teamId:id, capacity:document.getElementById('cp_'+id).value});
    refreshAdmin();
  } catch(e){ alert(e.message); }
}
async function delTeam(id){ if(confirm('حذف هذا الفريق نهائياً؟')){ try{ await api('/api/admin/delete-team',{teamId:id}); refreshAdmin(); }catch(e){alert(e.message);} } }
async function addTeam(){
  try {
    await api('/api/admin/add-team', {name:document.getElementById('newTeamName').value, color:document.getElementById('newTeamColor').value || '#a855f7', capacity:document.getElementById('newTeamCap').value});
    document.getElementById('newTeamName').value='';
    refreshAdmin();
  } catch(e){ alert(e.message); }
}
async function kick(u){ try{ await api('/api/admin/kick', {username:u}); refreshAdmin(); }catch(e){alert(e.message);} }

// confetti
function confetti(){
  const c = document.getElementById('confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const pieces = Array.from({length:120},()=>({x:Math.random()*c.width, y:-20-Math.random()*c.height/2, r:3+Math.random()*6, col:['#ef4444','#3b82f6','#eab308','#22c55e','#a855f7'][~~(Math.random()*5)], vy:2+Math.random()*4, vx:-1+Math.random()*2}));
  let t=0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height); t++;
    pieces.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); });
    if (t<160) requestAnimationFrame(draw); else ctx.clearRect(0,0,c.width,c.height);
  })();
}

// live refresh every 4s (all visitors see live updates)
setInterval(async ()=>{ if (token||adminToken) { try{ await render(); }catch(e){} } }, 4000);

// auto-enter if session exists
if (token) render();
</script>
</body>
</html>
